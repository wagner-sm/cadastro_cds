<!doctype html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <title>{{ 'Editar' if cd else 'Adicionar' }} CD</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    {% with messages = get_flashed_messages() %}
            {% if messages %}
                <div class="alert alert-danger alert-dismissible fade show w-75 mx-auto" role="alert">
                    {% for msg in messages %}
                        <div>{{ msg }}</div>
                    {% endfor %}
                    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
                </div>
            {% endif %}
        {% endwith %}
<div class="container mt-4">
    <h1 class="mb-4">{{ 'Editar' if cd else 'Adicionar' }} CD</h1>
    <form method="post" class="row g-3">
        <div class="col-md-6">
            <label class="form-label">Artista</label>
            <input name="artista" class="form-control" value="{{ cd.artista if cd else '' }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Álbum</label>
            <input name="album" class="form-control" value="{{ cd.album if cd else '' }}" required>
        </div>
        <div class="col-12">
            <label class="form-label">Descrição</label>
            <input name="descricao" class="form-control" value="{{ cd.descricao if cd else '' }}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Preço</label>
            <input name="preco" type="number" min="1" class="form-control" value="{{ cd.preco if cd else '' }}" required>
        </div>
        <div class="col-md-4">
            <label class="form-label">Quantidade</label>
            <input name="quantidade" type="number" min="1" class="form-control" value="{{ cd.quantidade if cd else '' }}" required>
        </div>
        <div class="col-12 mt-3">
            <button type="submit" class="btn btn-primary">Salvar</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Voltar</a>
        </div>
    </form>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
